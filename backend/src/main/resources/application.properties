# ===========================================
# H2 Database Configuration (Development)
# ===========================================
spring.datasource.url=jdbc:h2:mem:automotive_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console - Access at http://localhost:9090/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# JPA / Hibernate Configuration
# ===========================================
# Auto-create tables from entities (use update for dev, validate for prod)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===========================================
# Server Configuration
# ===========================================
# Local default 9090; cloud hosts set PORT (e.g. Render)
server.port=${PORT:9090}

# Throw NoHandlerFoundException for 404 - allows @ExceptionHandler to return JSON instead of Whitelabel
spring.mvc.throw-exception-if-no-handler-found=true
# Disable default static resource mapping so unmatched paths trigger NoHandlerFoundException (not ResourceHandler 404)
spring.web.resources.add-mappings=false

# ===========================================
# Actuator (health, metrics)
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===========================================
# OpenAPI / Swagger
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
